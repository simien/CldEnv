version: "3.8"

services:
  # 1. Caddy (Reverse Proxy & SSL)
  caddy:
    image: caddy@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy_net

  # 2a. n8n (Workflow Automation -- visual, node-based)
  # Pick ONE automation engine: this block, or 2b (Windmill) below. Running
  # both works fine on Oracle's free-tier specs, but most setups want one.
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:27b67c39bb1722317e2a6729b31f16282406d3341520793d47431082218d15bb
    container_name: n8n
    restart: always
    environment:
      - N8N_HOST=yourdomain.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://yourdomain.com/
      - N8N_EDITOR_BASE_URL=https://yourdomain.com/
      - N8N_SECURE_COOKIE=true
      - N8N_BLOCK_FS_READ_WRITE_ACCESS_ON_NODES=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_ALLOW_ENV_ACCESS_IN_NODES=true
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - GENERIC_TIMEZONE=America/New_York
      - N8N_PROXY_HOPS=1
      # Cloud model API keys, used by n8n's AI nodes
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docs:/home/node/.n8n-files/docs
    networks:
      - caddy_net

  # 2b. Windmill (Workflow Automation -- script-first, Python/TypeScript/Bash)
  # Alternative to n8n above. This is what the reference deployment behind
  # this tutorial actually runs. Delete this block (and its volumes/network
  # entries below) if you're using n8n instead.
  windmill_server:
    image: ghcr.io/windmill-labs/windmill@sha256:9b82ea234f12109127943f629fc61675be46975fb3a73483230863b003a7a316
    container_name: windmill_server
    restart: always
    environment:
      - DATABASE_URL=postgres://windmill:${WINDMILL_DB_PASSWORD}@windmill_db/windmill?sslmode=disable
      - BASE_URL=https://windmill.yourdomain.com
      - JSON_FMT_NOT_PRETTY=true
      - JOB_ISOLATION=process
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - KEEP_ENV_VARS=OPENROUTER_API_KEY
    ports:
      - "8001:8000"
    privileged: true
    depends_on:
      - windmill_db
      - windmill_lsp
    volumes:
      - windmill_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - caddy_net

  windmill_lsp:
    image: ghcr.io/windmill-labs/windmill-lsp@sha256:4e76621383915a938b8d45a9fab4bf4b8769068a73c079fccbbbc23be8da092e
    container_name: windmill_lsp
    restart: always
    volumes:
      - windmill_lsp_data:/root/.cache
    networks:
      - caddy_net

  windmill_db:
    image: postgres@sha256:727876d274666da0b92a445390ba093c84b8e9f8343e1c53cd4e9a7ab2d85310
    container_name: windmill_db
    restart: always
    environment:
      - POSTGRES_USER=windmill
      - POSTGRES_PASSWORD=${WINDMILL_DB_PASSWORD}
      - POSTGRES_DB=windmill
    volumes:
      - windmill_db_data:/var/lib/postgresql/data
    networks:
      - caddy_net

  # 3. Portainer CE (Container Management)
  portainer:
    image: portainer/portainer-ce@sha256:511f3f06c96fe3b993ebeaafde311c1959cae73a7ef825dba6397d51b450dffa
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/portainer_data:/data
    networks:
      - caddy_net

  # 4. Gitea (Self-Hosted Git)
  gitea:
    image: gitea/gitea@sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef
    container_name: gitea
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
    ports:
      - "2222:22" # SSH Access
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - caddy_net

  # 5. Uptime Kuma (Monitoring)
  uptime-kuma:
    image: louislam/uptime-kuma@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c
    container_name: uptime-kuma
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./deploy/uptime_kuma_data:/app/data
    networks:
      - caddy_net

  # 6. Watchtower (Automatic Updates)
  watchtower:
    image: containrrr/watchtower@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: watchtower
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.45
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --schedule "0 0 4 * * *" --cleanup

  # 7. Open WebUI (AI Interface)
  open-webui:
    image: ghcr.io/open-webui/open-webui@sha256:1a6399d237dc392a2313e0ca826020b3fd5d22536357840eb63393d18dc8b924
    container_name: open-webui
    restart: always
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_OLLAMA_API=true
      - ENABLE_OPENAI_API=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=https://ai.yourdomain.com
      # Antigravity v2.0: DeepSeek Direct + OpenRouter
      - OPENAI_API_BASE_URLS=https://api.deepseek.com;https://openrouter.ai/api/v1
      - OPENAI_API_KEYS=${DEEPSEEK_API_KEY};${OPENROUTER_API_KEY}
      - ENABLE_GOOGLE_API=true
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENABLE_GEMINI_API=true
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
      - qdrant
    networks:
      - caddy_net

  # 8. Browserless (Headless Ghost)
  browserless:
    image: ghcr.io/browserless/chromium@sha256:5252f0d0bb947acec41c39f4507fab4af15f9f9337267ca1a97fa026197df8e6
    container_name: browserless
    restart: always
    environment:
      - TOKEN=${BROWSERLESS_TOKEN}
    networks:
      - caddy_net

  # 9. File Browser (Web File Manager)
  filebrowser:
    image: filebrowser/filebrowser@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    container_name: filebrowser
    restart: always
    environment:
      - FB_BASEURL=/
    volumes:
      - ./docs:/srv
      - filebrowser_config:/config
      - filebrowser_db:/database
    networks:
      - caddy_net

  # --- Antigravity v2.0 Extensions ---

  # 10. Ollama (Embedding Server)
  ollama:
    image: ollama/ollama@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    container_name: ollama
    restart: always
    # Auto-pull lightweight embedding model
    entrypoint: /bin/sh
    command: "-c 'ollama serve & sleep 5 && ollama pull nomic-embed-text'"
    volumes:
      - ollama:/root/.ollama
    networks:
      - caddy_net

  # 11. Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    container_name: qdrant
    restart: always
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    ports:
      - "6333:6333"
    networks:
      - caddy_net

  # 12. Beszel Agent (Metrics Source)
  beszel-agent:
    image: henrygd/beszel-agent@sha256:00c88600e7d120128f623b2deb5257603d464e841fd68f88cc791dcc075f9e46
    container_name: beszel-agent
    restart: always
    network_mode: host
    environment:
      - PORT=45876
      - KEY=${BESZEL_KEY}
      - TOKEN=${BESZEL_TOKEN}
      - HUB_URL=https://monitor.yourdomain.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent

  # 13. Beszel Hub (Metrics Dashboard)
  beszel-hub:
    image: henrygd/beszel@sha256:fefb27166f5e1611ebf67f8697ea928a23f44efdb00af922e2ac3b5faa2efd5c
    container_name: beszel-hub
    restart: always
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - beszel_data:/app/pb_data
    networks:
      - caddy_net

  # 14. ChangeDetection.io (Web Watcher)
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io@sha256:ecacd9fd0c664a786b77daadbbbf51373519b29178a32df3ddbc5c594bc067ed
    container_name: changedetection
    restart: always
    environment:
      - PORT=5000
      - PLAYWRIGHT_DRIVER_URL=ws://browserless:3000
      - BASE_URL=https://watch.yourdomain.com
    volumes:
      - changedetection_data:/datastore
    networks:
      - caddy_net

  # 16. IT-Tools (Developer Utilities)
  it-tools:
    image: corentinth/it-tools@sha256:8b8128748339583ca951af03dfe02a9a4d7363f61a216226fc28030731a5a61f
    container_name: it-tools
    restart: always
    networks:
      - caddy_net

  # 17. NeverIdle (Oracle Cloud Keepalive)
  neveridle:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: neveridle
    restart: always
    command: sh -c "yes > /dev/null"
    networks:
      - caddy_net

networks:
  caddy_net:
    driver: bridge

volumes:
  caddy_data:
    external: true
    name: deploy_caddy_data
  caddy_config:
    external: true
    name: deploy_caddy_config
  gitea_data:
    external: true
    name: deploy_gitea_data
  n8n_data:
    external: true
    name: n8n_n8n_data
  windmill_data:
    external: true
    name: deploy_windmill_data
  windmill_lsp_data:
    external: true
    name: deploy_windmill_lsp_data
  windmill_db_data:
    external: true
    name: deploy_windmill_db_data
  open_webui_data:
    external: true
    name: assets_open_webui_data
  filebrowser_config:
    external: true
    name: deploy_filebrowser_config
  filebrowser_db:
    external: true
    name: deploy_filebrowser_db
  ollama:
    external: true
    name: deploy_ollama
  qdrant_storage:
    external: true
    name: deploy_qdrant_storage
  beszel_data:
    external: true
    name: deploy_beszel_data
  changedetection_data:
    external: true
    name: deploy_changedetection_data
